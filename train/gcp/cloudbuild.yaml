substitutions:
  _REGION: us-central1
  _REPO: aegis
  _IMAGE: trainer
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - train/gcp/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
